asyncapi: "3.0.0"
info:
  title: Orders API
  version: "1.0.0"
components:
  messages:
    OrderPlaced:
      payload:
        type: object
        properties:
          orderId:
            type: string
          items:
            type: array
            items:
              type: object
              properties:
                sku:
                  type: string
                qty:
                  type: integer
    InventoryFailed:
      payload:
        type: object
        properties:
          orderId:
            type: string
          reason:
            type: string
channels:
  FulfillmentChannel:
    address: "orders.fulfillment"
  DeadLetterChannel:
    address: "orders.deadletter"
