[package]
name = "etdl-target-dotnet"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "ETDL .NET target: generates a C# developer API (records, interfaces, orchestration classes) bound via modern P/Invoke (LibraryImport + UnmanagedCallersOnly) to the same compiled Rust ETDL runtime the Rust target consumes. Pure Rust to build - no .NET SDK needed to build this crate, only to run its generated output."
keywords = ["etdl", "code-generation", "dotnet", "csharp", "reliability"]
categories = ["compilers", "development-tools"]
homepage = "https://github.com/ETDL-lang/etdl"

[dependencies]
etdl-parser = { version = "0.3.1", path = "../etdl-parser" }
etdl-compiler = { version = "0.3.1", path = "../etdl-compiler", default-features = false }
serde_json.workspace = true

[dev-dependencies]
serde_yaml.workspace = true
