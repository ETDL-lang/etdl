# Declared uncertainty for each basic event, keyed by basic-event id.
#
# These are sampling laws for uncertainty PROPAGATION - statements about how
# well each probability is known, not about how likely each failure is.
#
# Beta posteriors come from observed failure counts under a uniform prior:
#   Beta(1 + failures, 1 + trials - failures)
# The Beta support is already [0,1], so no truncation is needed and the
# propagated interval is exact up to Monte Carlo error.

GatewayTimeout:
  # 100 failures in 10,000 charge attempts. Heavily instrumented: mean 1.0e-2,
  # sd 9.9e-5. The dominant contributor, and the best measured.
  law: beta
  alpha: 10000.0
  beta: 990000.0

GatewayUnreachable:
  # Barely observed: mean 1.2e-3 but sd 7.7e-4. Eight times less probable than
  # the timeout, and known an order of magnitude less precisely.
  law: beta
  alpha: 2.4
  beta: 1997.6

DatabaseUnavailable:
  # A vendor confidence interval rather than raw counts. Calibrating a Normal
  # to interval endpoints is an APPROXIMATION: it assumes symmetry and
  # normality, which fits poorly near 0. Prefer a Beta where counts exist.
  # The declared statistical meaning is preserved through to the result.
  law: normal-from-interval
  lower: 0.0035
  upper: 0.0065
  level: 0.95
  meaning: confidence
