[package]
name = "etdl-compiler"
version = "0.4.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "ETDL compiler: IEC 61025 fault tree resolution, MOCUS cut sets, ECEL type-checking, semantic validation, and code generation for event-driven microservices"
keywords = ["etdl", "code-generation", "fault-tree-analysis", "reliability", "event-driven"]
categories = ["compilers", "development-tools"]
homepage = "https://github.com/ETDL-lang/etdl"

[features]
default = ["reliability"]
reliability = ["dep:etdl-reliability-core"]

[dependencies]
etdl-parser = { version = "0.4.0", path = "../etdl-parser" }
etdl-tree-core = { version = "0.3.1", path = "../etdl-tree-core" }
etdl-probability-core = { version = "0.3.1", path = "../etdl-probability-core" }
etdl-reliability-core = { version = "0.3.1", path = "../etdl-reliability-core", optional = true }
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Dynamic supplement plugins (`etdl install`): sandboxed, fuel-limited
# wasmtime hosting, no WASI linked. Always on (not feature-gated) so
# `etdl install` works out of the box on every build.
wasmtime = { version = "48", default-features = false, features = ["cranelift", "runtime"] }
etdl-supplement-sdk = { version = "0.1.0", path = "../etdl-supplement-sdk" }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "etdl_bench"
harness = false
