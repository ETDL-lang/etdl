[package]
name = "etdl-compiler"
version = "0.3.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "ETDL compiler: IEC 61025 fault tree resolution, MOCUS cut sets, ECEL type-checking, semantic validation, and code generation for event-driven microservices"
keywords = ["etdl", "code-generation", "fault-tree-analysis", "reliability", "event-driven"]
categories = ["compilers", "development-tools"]
homepage = "https://github.com/ETDL-lang/etdl"

[features]
default = ["reliability"]
reliability = ["dep:etdl-reliability-core"]
# Dynamic supplement plugins (`etdl supplement install`): sandboxed,
# fuel-limited wasmtime hosting, no WASI linked. Optional because
# wasmtime is a substantial dependency (a Cranelift JIT) that a build not
# using dynamic plugins shouldn't have to pull in.
plugins = ["dep:wasmtime", "dep:etdl-supplement-sdk"]

[dependencies]
etdl-parser = { version = "0.3.1", path = "../etdl-parser" }
etdl-tree-core = { version = "0.3.1", path = "../etdl-tree-core" }
etdl-reliability-core = { version = "0.3.1", path = "../etdl-reliability-core", optional = true }
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wasmtime = { version = "48", optional = true, default-features = false, features = ["cranelift", "runtime"] }
etdl-supplement-sdk = { version = "0.1.0", path = "../etdl-supplement-sdk", optional = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "etdl_bench"
harness = false
