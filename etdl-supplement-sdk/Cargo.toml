[package]
name = "etdl-supplement-sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "SDK for writing ETDL supplement plugins: a Supplement trait and the etdl_supplement! macro generating a conforming wasm32-unknown-unknown module for etdl-cli's dynamic plugin loader"
keywords = ["etdl", "wasm", "plugin", "supplement"]
categories = ["development-tools", "wasm"]
homepage = "https://github.com/ETDL-lang/etdl"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
