language = "C"
header = """
/* AUTOGENERATED by cbindgen from etdl-runtime-ffi's src/lib.rs — DO NOT EDIT.
 * Regenerated on every `cargo build -p etdl-runtime-ffi`.
 *
 * This is the one stable ABI surface every ETDL language target (Java, Go,
 * .NET, Python via ctypes, ...) binds to. See docs/architecture/targets.md.
 */
"""
include_guard = "ETDL_RUNTIME_FFI_H"
tab_width = 4
line_length = 100
documentation = true
documentation_style = "doxy"

[fn]
args = "auto"

[parse]
parse_deps = false
