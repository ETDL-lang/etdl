[workspace]
resolver = "2"
members = [
    "etdl-parser",
    "etdl-compiler",
    "etdl-core",
    "etdl-cli",
    "etdl-wasm",
    "etdl-probability-core",
    "etdl-tree-core",
    "etdl-reliability-core",
    "etdl-reliability",
    "etdl-reliability-ontology",
    "etdl-failure-discovery",
    "etdl-conformance",
]

# The generated-code compile-check harness is an in-tree crate used by
# `etdl-compiler/tests/codegen_test.rs`; excluded from normal builds.
exclude = ["etdl-compiler/tests/gencheck"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/usamassem/etdl"
readme = "README.md"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
nom = "7"
thiserror = "2"
