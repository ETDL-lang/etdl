[package]
name = "etdl-target-java"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "ETDL Java target: generates idiomatic Java (orchestration + handler interfaces + a minimal read-only runtime) from the same validated ETDL IR the Rust target consumes. Pure Rust — building this crate never requires a JDK; only running the generated Java output does."
keywords = ["etdl", "code-generation", "java", "reliability", "event-driven"]
categories = ["compilers", "development-tools"]
homepage = "https://github.com/ETDL-lang/etdl"

[dependencies]
etdl-parser = { version = "0.3.1", path = "../etdl-parser" }
etdl-compiler = { version = "0.3.1", path = "../etdl-compiler", default-features = false }
serde_json.workspace = true

[dev-dependencies]
serde_yaml.workspace = true
